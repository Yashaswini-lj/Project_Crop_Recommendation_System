{% extends "base.html" %}
{% block title %}Register | AGRIGUIDE{% endblock %}
{% block content %}
<section class="auth-page"><div class="auth-card wide">
  <div class="auth-icon">👩‍🌾</div><span class="eyebrow">NEW FARMER</span><h1>Create your account</h1><p>Your name and prediction history stay connected to your own account.</p>
  <form method="post" class="form two">
    <label>Farmer name<input name="name" maxlength="80" placeholder="Enter your full name" required></label>
    <label>Phone number<input name="phone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" required></label>
    <label>Password<input type="password" name="password" minlength="6" placeholder="Minimum 6 characters" required></label>
    <label>Confirm password<input type="password" name="confirm_password" minlength="6" placeholder="Re-enter password" required></label>
    <button class="btn primary full span2" type="submit">Create Account</button>
  </form>
  <p class="auth-bottom">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
</div></section>
{% endblock %}
